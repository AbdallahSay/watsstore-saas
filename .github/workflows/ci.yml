name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
  pull_request:
    branches:
      - master
      - main
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore WatsStore.sln

      - name: Build solution
        run: dotnet build WatsStore.sln --configuration Release --no-restore

      - name: Run unit & integration tests
        run: dotnet test WatsStore.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Checkout API configuration and retry regression tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://watsstore.runasp.net/api

  checkout:
    name: Checkout (Chrome Mobile & Desktop E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build isolated backend fixture host
        run: dotnet build backend.E2E/WatsStore.E2E.csproj --configuration Release
      - name: Start isolated API and wait for fixtures
        run: |
          mkdir -p work
          dotnet run --project backend.E2E/WatsStore.E2E.csproj --configuration Release --no-build > work/e2e-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if test -f work/e2e-fixtures.json; then exit 0; fi
            sleep 1
          done
          tail -40 work/e2e-api.log
          exit 1
      - name: Build and start local storefront
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          npm run build
          npm run start > ../work/e2e-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify actual checkout, lost response and safe replay
        run: npm run test:checkout
        working-directory: frontend
      - name: Verify My Orders, merchant transitions, tracking and notification permissions
        run: npm run test:customer-commerce
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-browser-evidence
          path: |
            work/p0-checkout/e2e/
            work/customer-commerce/e2e/
