name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - main
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore WatsStore.sln

      - name: Build solution
        run: dotnet build WatsStore.sln --configuration Release --no-restore

      - name: Run unit & integration tests
        run: dotnet test WatsStore.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://watsstore.runasp.net/api
